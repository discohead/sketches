[package]
name = "kit"
version = "0.1.0"
edition.workspace = true

[dependencies]
piece-meta = { workspace = true }
nannou = { workspace = true }
bevy = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
image = { workspace = true }

# Capture mode hands app focus back to whatever was frontmost (see `capture::focus`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSResponder", "NSRunningApplication", "NSWorkspace"] }
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", features = ["NSThread"] }

[dev-dependencies]
image = { workspace = true }
tempfile = { workspace = true }

# Turn on getrandom's browser backend for everything that links kit (nannou's rand needs it).
# `.cargo/config.toml` sets the matching `getrandom_backend` cfg.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
